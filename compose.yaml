services:
  app:
    image: ghcr.io/chunyu-zhou/easysub:latest
    container_name: easysub
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      SQLITE_PATH: easysub.db
      LISTEN: :8000
      # Set these before the first start. They only seed a newly created database.
      ADMIN_USERNAME: easysub-admin
      ADMIN_PASSWORD: replace-with-a-long-unique-password
      ADMIN_EMAIL: admin@example.com
      # Generate once, then keep it stable. Linux/macOS: openssl rand -hex 32
      # Windows PowerShell: [Convert]::ToHexString((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
      # JWT_SECRET signs JWTs and encrypts stored secrets; changing it invalidates sessions and encrypted credentials.
      JWT_SECRET: replace-with-a-long-random-secret
      MCP_ENABLED: "true"
    volumes:
      - easysub_data:/app/data
    ports:
      - "8000:8000"

volumes:
  easysub_data:
